<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Keyboard Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .info {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    
    .form-group {
      margin: 20px 0;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .button:hover {
      transform: translateY(-2px);
    }
    
    .debug-info {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>🎹 Virtual Keyboard Test Page</h1>
  
  <div class="info">
    <strong>Instructions:</strong>
    <ol>
      <li>Click on any input field below</li>
      <li>The virtual keyboard should appear automatically</li>
      <li>Or press <strong>Ctrl + Shift + K</strong> to toggle it</li>
      <li>Check the browser console (F12) for debug messages</li>
    </ol>
  </div>
  
  <form>
    <div class="form-group">
      <label for="name">Name (text input):</label>
      <input type="text" id="name" placeholder="Click here to activate keyboard...">
    </div>
    
    <div class="form-group">
      <label for="email">Email (email input):</label>
      <input type="email" id="email" placeholder="test@example.com">
    </div>
    
    <div class="form-group">
      <label for="message">Message (textarea):</label>
      <textarea id="message" placeholder="Type a longer message here..."></textarea>
    </div>
    
    <div class="form-group">
      <label for="search">Search (search input):</label>
      <input type="search" id="search" placeholder="Search something...">
    </div>
    
    <button type="button" class="button">Submit (won't submit)</button>
  </form>
  
  <div class="debug-info">
    <strong>Debug Console:</strong>
    <div id="debug-log">Waiting for extension to load...</div>
  </div>
  
  <script>
    // Debug logging
    const debugLog = document.getElementById('debug-log');
    
    function log(message) {
      const time = new Date().toLocaleTimeString();
      debugLog.innerHTML += `<br>[${time}] ${message}`;
      console.log(message);
    }
    
    // Check if extension is loaded
    setTimeout(() => {
      if (window.vkInstance) {
        log('✅ Virtual Keyboard extension detected!');
        log('Instance: ' + typeof window.vkInstance);
      } else {
        log('❌ Virtual Keyboard NOT detected');
        log('Please check:');
        log('1. Extension is installed and enabled');
        log('2. Page was refreshed after installing extension');
        log('3. Check Chrome console (F12) for errors');
      }
    }, 2000);
    
    // Monitor field focus
    document.querySelectorAll('input, textarea').forEach(field => {
      field.addEventListener('focus', () => {
        log(`Field focused: ${field.id || field.type}`);
      });
    });
    
    // Listen for keyboard shortcut
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'K') {
        log('Keyboard shortcut detected: Ctrl+Shift+K');
      }
    });
  </script>
</body>
</html>
